<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손글씨 숫자 인식 데모</title>
<style>
:root {
  --bg: #F2F4F8; --surface: #FFFFFF; --text: #1B2437; --muted: #5B6478;
  --line: #D8DDE7; --accent: #2A52D4; --ok: #16744C; --warn: #8F5000; --warn-bg: #FAEED8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141A28; --surface: #1C2335; --text: #E6EAF3; --muted: #9AA3B8;
    --line: #303A54; --accent: #8AA4FF; --ok: #5CC89A; --warn: #F2B866; --warn-bg: #3E3120;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  line-height: 1.6;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 36px 20px 80px; }
h1 { margin: 0 0 4px; font-size: 1.6rem; letter-spacing: -0.02em; }
.sub { margin: 0 0 24px; color: var(--muted); }
.status {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
  border-radius: 999px; font-size: .85rem; font-weight: 600; margin-bottom: 20px;
  background: var(--warn-bg); color: var(--warn);
}
.status.is-ready { background: transparent; color: var(--ok); border: 1px solid currentColor; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 20px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.card h2 { margin: 0 0 12px; font-size: 1rem; }
#pad {
  display: block; width: 100%; aspect-ratio: 1; border-radius: 10px;
  background: #000; touch-action: none; cursor: crosshair;
}
.toolbar { display: flex; gap: 8px; margin-top: 12px; }
button {
  flex: 1; padding: 10px 14px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#preview {
  width: 112px; height: 112px; image-rendering: pixelated;
  border-radius: 8px; background: #000; display: block;
}
.result { margin-top: 14px; }
.result__digit { font-size: 3.2rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.result__note { color: var(--muted); font-size: .85rem; margin-top: 6px; }
.bars { margin-top: 12px; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.bar { display: grid; grid-template-columns: 16px 1fr 44px; gap: 8px; align-items: center; font-size: .8rem; }
.bar__track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar__fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width 200ms ease; }
.bar.top .bar__fill { background: var(--ok); }
footer { margin-top: 28px; color: var(--muted); font-size: .85rem; }
code { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: .85em; }
@media (max-width: 620px) { .grid { grid-template-columns: 1fr; } #preview { margin: 0 auto; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>손글씨 숫자 인식</h1>
  <p class="sub">캔버스에 0~9 숫자를 쓰면 28×28로 변환해 인식합니다.</p>
  <span id="status" class="status">모델 파일 없음 — 데모 모드로 동작 중</span>

  <div class="grid">
    <div class="card">
      <h2>여기에 숫자를 쓰세요</h2>
      <canvas id="pad" width="280" height="280"></canvas>
      <div class="toolbar">
        <button type="button" id="clear">지우기</button>
        <button type="button" id="predict" class="primary">인식하기</button>
      </div>
    </div>

    <div class="card">
      <h2>모델 입력 (28×28)</h2>
      <canvas id="preview" width="28" height="28"></canvas>
      <div class="result">
        <div id="digit" class="result__digit">–</div>
        <div id="note" class="result__note">숫자를 쓴 뒤 인식하기를 누르세요.</div>
      </div>
      <div id="bars" class="bars" hidden></div>
    </div>
  </div>

  <footer>
    학습한 모델을 <code>model.onnx</code> 이름으로 이 페이지와 같은 위치에 두면 자동으로 실제 모델로 인식합니다.
    모델이 없으면 픽셀 규칙 기반 데모 모드로 동작합니다.
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.24.1/ort.min.js"></script>
<script>
(function () {
  'use strict';

  const pad = document.getElementById('pad');
  const ctx = pad.getContext('2d', { willReadFrequently: true });
  const preview = document.getElementById('preview');
  const pctx = preview.getContext('2d');
  const statusEl = document.getElementById('status');
  const digitEl = document.getElementById('digit');
  const noteEl = document.getElementById('note');
  const barsEl = document.getElementById('bars');

  /* ---------- Drawing pad ---------- */
  let drawing = false;
  let last = null;

  function resetPad() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, pad.width, pad.height);
    digitEl.textContent = '–';
    noteEl.textContent = '숫자를 쓴 뒤 인식하기를 누르세요.';
    barsEl.hidden = true;
    pctx.fillStyle = '#000';
    pctx.fillRect(0, 0, 28, 28);
  }

  function pos(e) {
    const r = pad.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (pad.width / r.width),
      y: (e.clientY - r.top) * (pad.height / r.height)
    };
  }

  pad.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    pad.setPointerCapture(e.pointerId);
    drawing = true;
    last = pos(e);
  });
  pad.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = pos(e);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 20;               // MNIST 획 두께와 비슷한 비율
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  });
  const stop = () => { drawing = false; last = null; };
  pad.addEventListener('pointerup', stop);
  pad.addEventListener('pointercancel', stop);

  /* ---------- Preprocess: crop -> center -> 28x28 (MNIST style) ---------- */
  function preprocess() {
    const { width, height } = pad;
    const img = ctx.getImageData(0, 0, width, height);
    let minX = width, minY = height, maxX = -1, maxY = -1;
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (img.data[(y * width + x) * 4] > 20) {   // red channel = brightness
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return null; // empty canvas

    const boxW = maxX - minX + 1;
    const boxH = maxY - minY + 1;
    // MNIST convention: digit fits in 20x20, centered on 28x28
    const scale = 20 / Math.max(boxW, boxH);
    const w = Math.max(1, Math.round(boxW * scale));
    const h = Math.max(1, Math.round(boxH * scale));

    pctx.fillStyle = '#000';
    pctx.fillRect(0, 0, 28, 28);
    pctx.imageSmoothingEnabled = true;
    pctx.drawImage(pad, minX, minY, boxW, boxH,
      Math.floor((28 - w) / 2), Math.floor((28 - h) / 2), w, h);

    const small = pctx.getImageData(0, 0, 28, 28);
    const pixels = new Float32Array(28 * 28);
    for (let i = 0; i < 28 * 28; i++) pixels[i] = small.data[i * 4] / 255;
    return pixels;
  }

  /* ---------- Model (optional) ---------- */
  let session = null;
  let inputName = null;
  let normalize = false;

  async function loadModel() {
    if (!window.ort) {
      statusEl.textContent = '데모 모드 — 추론 라이브러리(ort) 로드 실패';
      return;
    }
    try {
      const res = await fetch('model.onnx');
      const type = res.headers.get('content-type') || '';
      if (!res.ok || type.includes('text/html')) {
        statusEl.textContent = '모델 파일 없음 (' + res.status + ') — 데모 모드로 동작 중';
        return;
      }
      const bytes = new Uint8Array(await res.arrayBuffer());
      session = await ort.InferenceSession.create(bytes);
      inputName = session.inputNames[0];
      statusEl.textContent = '모델 로드 완료 — 실제 모델로 인식 중';
      statusEl.classList.add('is-ready');
    } catch (e) {
      session = null;
      console.error('model.onnx load failed:', e);
      statusEl.textContent = '모델을 읽지 못했습니다 — 데모 모드 (F12 콘솔 참고)';
    }
  }

  function softmax(arr) {
    const max = Math.max(...arr);
    const exp = arr.map((v) => Math.exp(v - max));
    const sum = exp.reduce((a, b) => a + b, 0);
    return exp.map((v) => v / sum);
  }

  async function predictWithModel(pixels) {
    // 대부분의 MNIST 모델 입력: [1,1,28,28], 0~1 또는 표준화 값
    let data = pixels;
    if (normalize) data = pixels.map((v) => (v - 0.1307) / 0.3081);
    const tensor = new ort.Tensor('float32', Float32Array.from(data), [1, 1, 28, 28]);
    const out = await session.run({ [inputName]: tensor });
    const logits = Array.from(out[session.outputNames[0]].data);
    return softmax(logits);
  }

  /* ---------- Demo fallback: 간단한 픽셀 규칙 ----------
     모델 없이 배포 파이프라인을 시험할 수 있도록 한 대략적 추정입니다. */
  function predictDemo(pixels) {
    const at = (x, y) => pixels[y * 28 + x];
    let ink = 0, cx = 0, cy = 0;
    for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
      const v = at(x, y); ink += v; cx += v * x; cy += v * y;
    }
    cx /= ink; cy /= ink;

    // 획과 만나는 횟수(가로줄 3곳)로 구멍/줄기 구조를 어림
    const crossings = (y) => {
      let c = 0, on = false;
      for (let x = 0; x < 28; x++) {
        const v = at(x, y) > 0.35;
        if (v && !on) c++;
        on = v;
      }
      return c;
    };
    const top = crossings(7), mid = crossings(14), bot = crossings(21);
    const aspectInk = ink / (28 * 28);

    const scores = new Array(10).fill(0.02);
    if (top >= 2 && mid >= 2 && bot >= 2) { scores[0] += 0.5; scores[8] += 0.25; }
    if (top <= 1 && mid <= 1 && bot <= 1 && aspectInk < 0.12) scores[1] += 0.6;
    if (top >= 2 && mid <= 1 && bot >= 1) { scores[7] += 0.3; scores[2] += 0.2; }
    if (top >= 1 && mid >= 2 && bot >= 1) { scores[4] += 0.25; scores[9] += 0.2; scores[6] += 0.15; }
    if (mid >= 2 && bot >= 2 && top <= 1) scores[6] += 0.3;
    if (top >= 2 && mid >= 2 && bot <= 1) scores[9] += 0.3;
    if (cy < 13) scores[7] += 0.1;
    scores[3] += 0.08; scores[5] += 0.08; scores[2] += 0.05;

    const sum = scores.reduce((a, b) => a + b, 0);
    return scores.map((v) => v / sum);
  }

  function renderResult(probs, demo) {
    const best = probs.indexOf(Math.max(...probs));
    digitEl.textContent = String(best);
    noteEl.textContent = demo
      ? '데모 모드 추정입니다. model.onnx를 올리면 정확해집니다.'
      : `신뢰도 ${(probs[best] * 100).toFixed(1)}%`;
    barsEl.hidden = false;
    barsEl.replaceChildren(...probs.map((p, i) => {
      const bar = document.createElement('div');
      bar.className = 'bar' + (i === best ? ' top' : '');
      const track = document.createElement('div');
      track.className = 'bar__track';
      const fill = document.createElement('div');
      fill.className = 'bar__fill';
      track.append(fill);
      const label = document.createElement('span');
      label.textContent = String(i);
      const pct = document.createElement('span');
      pct.textContent = (p * 100).toFixed(1) + '%';
      bar.append(label, track, pct);
      requestAnimationFrame(() => { fill.style.width = (p * 100) + '%'; });
      return bar;
    }));
  }

  document.getElementById('clear').addEventListener('click', resetPad);
  document.getElementById('predict').addEventListener('click', async () => {
    const pixels = preprocess();
    if (!pixels) {
      noteEl.textContent = '캔버스가 비어 있어요. 숫자를 먼저 써 주세요.';
      return;
    }
    try {
      if (session) renderResult(await predictWithModel(pixels), false);
      else renderResult(predictDemo(pixels), true);
    } catch (e) {
      noteEl.textContent = '인식 중 오류가 발생했습니다: ' + e.message;
    }
  });

  resetPad();
  loadModel();
})();
</script>
</body>
</html>
